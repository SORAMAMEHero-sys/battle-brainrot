<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バトル・ザ・ブレインロット</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#111;color:#fff;min-height:100vh}
button{font:inherit;cursor:pointer}
#app{max-width:1100px;margin:auto;padding:12px}
.panel{background:#202020;border:2px solid #444;border-radius:14px;padding:12px;margin-bottom:12px}
h1,h2,h3{margin:5px 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.enemy-area{display:grid;grid-template-columns:1fr 1.2fr;gap:12px}
.enemy-image{width:100%;height:260px;object-fit:contain;background:#090909;border-radius:12px}
.stat{font-size:18px;margin:7px 0}
#totalStats{font-size:20px;text-align:center}
.character-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.card{background:#2c2c2c;border:2px solid #555;border-radius:12px;padding:8px;position:relative}
.card.equipped{border-color:#fff;box-shadow:0 0 0 2px #fff inset}
.card img{width:100%;height:110px;object-fit:contain;background:#111;border-radius:8px}
.card-name{font-weight:bold;margin:5px 0;font-size:14px}
.card-info{font-size:13px;line-height:1.5}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;background:#555;font-size:12px}
.card button,.main-btn{border:0;border-radius:9px;padding:8px 10px;margin-top:7px;background:#444;color:#fff}
.main-btn{background:#fff;color:#111;font-weight:bold}
.card button:hover,.main-btn:hover{opacity:.85}
.small{font-size:12px;color:#bbb}
.mutation-list{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.mutation{display:inline-block;padding:2px 6px;border-radius:8px;background:#444;font-size:12px}
#battleLog{height:120px;overflow:auto;background:#0b0b0b;padding:8px;border-radius:8px;font-size:13px}
.machine{display:none;margin-top:10px;background:#151515;border:2px solid #555;border-radius:12px;padding:12px}
.machine.open{display:block}
.machine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.select-card{border:2px solid #555;background:#292929;color:#fff;border-radius:10px;padding:7px}
.select-card.selected{border-color:#fff;box-shadow:0 0 0 1px #fff inset}
.select-card img{width:100%;height:80px;object-fit:contain}
.probability-box{background:#101010;border:1px solid #555;border-radius:10px;padding:10px;margin:8px 0}
.prob-row{display:flex;justify-content:space-between;padding:3px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font-weight:bold;display:none;z-index:50}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{max-width:470px;width:100%;max-height:90vh;overflow:auto;background:#222;border:2px solid #666;border-radius:15px;padding:18px}
.modal button{padding:9px 13px;border:0;border-radius:9px;margin:5px}
.danger{background:#d33!important;color:#fff}
#dropOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:55;align-items:center;justify-content:center;text-align:center}
#dropOverlay.show{display:flex}
.drop-box{animation:pop .45s ease;background:#222;border:3px solid #fff;border-radius:20px;padding:25px;max-width:420px}
.drop-box img{width:220px;height:180px;object-fit:contain}
.event-banner{border:2px solid #666;border-radius:12px;padding:10px;background:#151515;margin-bottom:12px}
.event-active{font-weight:bold}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@media(max-width:700px){.enemy-area{grid-template-columns:1fr}.enemy-image{height:210px}}
</style>
</head>
<body>
<div id="app">
  <div class="panel">
    <h1>🧠⚔️ バトル・ザ・ブレインロット</h1>
    <div class="small">最大3体を装備して自動バトル！</div>
  </div>

  <div class="event-banner" id="eventBanner"></div>

  <div class="panel">
    <h2>① 👹 敵のステータス</h2>
    <div id="enemyStats"></div>
  </div>

  <div class="panel">
    <h2>② 🖼️ 敵の画像</h2>
    <img id="enemyImage" class="enemy-image" alt="敵Brainrot">
  </div>

  <div class="panel">
    <h2>⑥ 📊 使用キャラの合計ステータス</h2>
    <div id="totalStats"></div>
    <div id="equippedNames" class="small" style="text-align:center"></div>
  </div>

  <div class="panel">
    <h2>⚔️ バトル</h2>
    <div class="row">
      <button class="main-btn" onclick="startBattle()">▶ バトル開始</button>
      <button class="main-btn" onclick="openMachine()">⚙️ 合体マシン</button>
      <button class="main-btn" onclick="openFuseMachine()">🔥 ヒューズ</button>
    </div>
    <div id="battleLog"></div>
  </div>

  <div class="panel">
    <h2>③ 🧠 所持キャラ一覧</h2>
    <div id="characterList" class="character-grid"></div>
  </div>

  <div class="panel">
    <h2>④ ⚙️ 合体マシン</h2>
    <div class="small">同じキャラ・同じ★数の2体を選択して合体できます。最大★10。変異は70%で引き継ぎます。</div>
    <div id="machine" class="machine">
      <div id="machineList" class="machine-grid"></div>
      <div class="row" style="margin-top:10px">
        <button class="main-btn" onclick="fuseSelected()">⚙️ 合体する</button>
        <button class="main-btn" onclick="closeMachine()">閉じる</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>🔥 ヒューズマシン</h2>
    <div class="small">キャラを5体投入。合計Fuse Pointで完成キャラの確率が決まります。変異は70%で引き継ぎます。</div>
    <div id="fuseMachine" class="machine">
      <div id="fuseSelectionInfo"></div>
      <div id="fuseProbability" class="probability-box"></div>
      <div id="fuseList" class="machine-grid"></div>
      <div class="row" style="margin-top:10px">
        <button class="main-btn" onclick="fuseMachineExecute()">🔥 合成する</button>
        <button class="main-btn" onclick="closeFuseMachine()">閉じる</button>
      </div>
    </div>
  </div>


  <div class="panel">
    <h2>🛒 ショップ</h2>
    <div class="small">📖 スキルの本は3つ並び、30分ごとに入れ替わります。</div>
    <div id="shopBooks"></div>
  </div>

  <div class="panel">
    <h2>⑤ 📖 キャラ図鑑</h2>
    <div id="encyclopedia" class="character-grid"></div>
  </div>
</div>

<div id="toast"></div>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalText"></div>
    <div id="modalButtons"></div>
  </div>
</div>

<div id="dropOverlay">
  <div class="drop-box">
    <h2>🎉 ドロップ！！ 🎉</h2>
    <img id="dropImage" alt="獲得Brainrot">
    <h2 id="dropName"></h2>
    <div id="dropInfo"></div>
    <button class="main-btn" onclick="closeDrop()">GET！</button>
  </div>
</div>

<script>
/*
  セーブキー固定：
  "battleTheBrainrotSave"

  現行仕様:
  - 味方HPは基本HP×7
  - 最大3体装備
  - 合体マシン: 同キャラ・同★を2体、★10まで
  - ヒューズ: 5体必須、Fuse Pointで確率決定
  - 変異: イベント中、敵撃破時30%で付与
  - 合体/ヒューズの変異引き継ぎ70%
  - 停止ボタンは仕様上削除
*/

const SAVE_KEY = "battleTheBrainrotSave";

const MUTATIONS = {
  fire:  {name:"⚡️変異", key:"fire"},
  rain:  {name:"🌧変異", key:"rain"},
  sun:   {name:"☀️変異", key:"sun"},
  snow:  {name:"⛄️変異", key:"snow"},
  demon: {name:"😈悪魔変異", key:"demon"}
};

/* 📖 スキルの本
   🧬変異とは完全に別システム。変異はここには入れない。 */
const SKILL_BOOKS = {
  statusResist: {name:"状態異常耐性の本", effect:"状態異常時間20%カット", price:150},
  attackUp: {name:"攻撃力アップの本", effect:"攻撃力1.3倍", price:100},
  hpUp: {name:"体力アップの本", effect:"体力1.3倍", price:100},
  dodge: {name:"回避の本", effect:"回避10%", price:200},
  extremeAttackUp: {name:"極・攻撃力アップの本", effect:"攻撃力1.75倍", price:3000},
  extremeHpUp: {name:"極・体力アップの本", effect:"体力1.75倍", price:3000},
  extremeDodge: {name:"極・回避の本", effect:"回避35%", price:5500}
};

const MAX_BOOKS_PER_CHARACTER = 3;
const BOOK_CANCEL_COST = 1000;

const characters = [
  {id:"buruburu", name:"ブルブルパタピム", rarity:"コモン", hp:10, power:10, image:"IMG_3216.jpeg", drop:1, fusePoint:1},
  {id:"tralalero", name:"トララレロトラララ", rarity:"コモン", hp:15, power:7, image:"IMG_3214.jpeg", drop:1, fusePoint:1},
  {id:"tung", name:"トゥントゥントゥンサフール", rarity:"コモン", hp:7, power:13, image:"IMG_3215.jpeg", drop:1, fusePoint:1},
  {id:"job", name:"ジョブジョブサフール", rarity:"レア", hp:15, power:15, image:"IMG_3220.png", drop:.30, fusePoint:2},
  {id:"garama", name:"ガラマ＆マドゥンドゥン", rarity:"レア", hp:14, power:16, image:"IMG_3219.png", drop:.30, fusePoint:2},
  {id:"aaa", name:"AAAサフール", rarity:"ゴット", hp:20, power:15, image:"IMG_3218.png", drop:.05, fusePoint:5},
  {id:"bros", name:"ロスブロス", rarity:"ゴット", hp:17, power:18, image:"IMG_3217.webp", drop:.05, fusePoint:5},
  {id:"pakurah", name:"パクラフマット", rarity:"シークレット", hp:30, power:24, image:"IMG_3226.webp", drop:.50, fusePoint:10, secretRate:50},
  {id:"swagmango", name:"スワッグマンゴー", rarity:"シークレット", hp:35, power:26, image:"IMG_3227.jpeg", drop:.35, fusePoint:13, secretRate:35},
  {id:"spaghetti", name:"スパゲッティトイレ", rarity:"シークレット", hp:45, power:33, image:"IMG_3228.webp", drop:.15, fusePoint:20, secretRate:12},
  {id:"caneloni", name:"カネローニドラゴーニ", rarity:"シークレット", hp:75, power:50, image:"IMG_3229.jpeg", drop:.03, fusePoint:30, secretRate:3}
];

const SECRET_RATES = [
  {id:"pakurah", rate:50},
  {id:"swagmango", rate:35},
  {id:"spaghetti", rate:12},
  {id:"caneloni", rate:3}
];

const FUSE_TABLE = [
  {min:1,max:5, rows:[["job",50],["garama",50]]},
  {min:6,max:10, rows:[["job",50],["garama",43],["aaa",7]]},
  {min:11,max:25, rows:[["bros",50],["aaa",46],["pakurah",4]]},
  {min:26,max:40, rows:[["bros",10],["pakurah",70],["swagmango",19],["spaghetti",1]]},
  {min:41,max:Infinity, rows:[["pakurah",20],["swagmango",75],["spaghetti",5]]}
];

let inventory = [];
let equipped = [];
let enemy = null;
let battleTimer = null;
let enemyTimer = null;
let battleRunning = false;
let machineSelection = [];
let fuseSelection = [];
let battleHP = {};
let eventTimer = null;
let gold = 0;
let shopBooks = [];
let shopSlot = -1;
let adminEventState = {
  active:false,
  startedKey:"",
  endSpawnedKey:""
};

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "uid_"+Date.now()+"_"+Math.random().toString(36).slice(2);
}

function defaultInventory(){
  return [
    {uid:uid(),id:"buruburu",star:0,mutations:[],books:[]},
    {uid:uid(),id:"tralalero",star:0,mutations:[],books:[]},
    {uid:uid(),id:"tung",star:0,mutations:[],books:[]}
  ];
}

function normalizeItem(item){
  return {
    uid:item.uid || uid(),
    id:item.id,
    star:Number.isFinite(Number(item.star)) ? Math.max(0,Math.min(10,Number(item.star))) : 0,
    mutations:Array.isArray(item.mutations) ? [...new Set(item.mutations.filter(x=>MUTATIONS[x]))] : [],
    books:Array.isArray(item.books) ? [...new Set(item.books.filter(x=>SKILL_BOOKS[x]))].slice(0,MAX_BOOKS_PER_CHARACTER) : []
  };
}

function saveGame(){
  const data={inventory,equipped,gold,shopBooks,shopSlot};

  localStorage.setItem(SAVE_KEY,JSON.stringify(data));
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){
      inventory=defaultInventory();
      equipped=inventory.map(x=>x.uid);
      saveGame();
      setTimeout(()=>log("🎁 初回プレイ！コモン3種を獲得！"),0);
    }else{
      const data=JSON.parse(raw);
      inventory=Array.isArray(data.inventory) ? data.inventory.map(normalizeItem).filter(x=>getCharacter(x.id)) : defaultInventory();
      equipped=Array.isArray(data.equipped) ? data.equipped.filter(uid=>inventory.some(x=>x.uid===uid)) : [];
      gold=Number.isFinite(Number(data.gold))?Number(data.gold):0;
      shopBooks=Array.isArray(data.shopBooks)?data.shopBooks.filter(x=>SKILL_BOOKS[x]):[];
      shopSlot=Number.isFinite(Number(data.shopSlot))?Number(data.shopSlot):-1;
      saveGame();
    }
  }catch(e){
    inventory=defaultInventory();
    equipped=inventory.map(x=>x.uid);
    saveGame();
  }
}

function getCharacter(id){return characters.find(c=>c.id===id)}
function getOwned(uid){return inventory.find(x=>x.uid===uid)}

function placeholderImage(c){
  const text=encodeURIComponent((c.rarity==="シークレット"?"🕵️ ":"")+"🧠 "+c.name);
  return "data:image/svg+xml;charset=UTF-8,"+
    "<svg xmlns='http://www.w3.org/2000/svg' width='500' height='350'>"+
    "<rect width='100%' height='100%' fill='%23101010'/>"+
    "<text x='50%' y='45%' fill='white' font-size='30' text-anchor='middle'>"+text+"</text>"+
    "<text x='50%' y='62%' fill='%23aaaaaa' font-size='18' text-anchor='middle'>画像未設定</text></svg>";
}

function imageSrc(c){return c.image || placeholderImage(c)}

function mutationNames(muts){
  return (muts||[]).map(k=>MUTATIONS[k]?.name||k);
}

function mutationHTML(muts){
  if(!muts || !muts.length) return "";
  return "<div class='mutation-list'>"+mutationNames(muts).map(x=>"<span class='mutation'>"+x+"</span>").join("")+"</div>";
}

function bookNames(books){
  return (books||[]).map(k=>SKILL_BOOKS[k]?.name||k);
}

function bookHTML(books){
  if(!books || !books.length) return "";
  return "<div class='mutation-list'>"+bookNames(books).map(x=>"<span class='mutation'>📖 "+x+"</span>").join("")+"</div>";
}

function inheritBooksForFusion(a,b){
  /* ⚙️通常の合体では本を必ず引き継ぐ。重複は1冊にまとめ、最大3冊。 */
  return [...new Set([...(a.books||[]),...(b.books||[])])].slice(0,MAX_BOOKS_PER_CHARACTER);
}

function addBookToCharacter(uid,bookKey){
  const item=getOwned(uid);
  if(!item || !SKILL_BOOKS[bookKey]) return false;
  item.books=Array.isArray(item.books)?item.books:[];
  if(item.books.length>=MAX_BOOKS_PER_CHARACTER){
    toast("📖 1キャラに付けられる本は3個までです");
    return false;
  }
  item.books.push(bookKey);
  saveGame();
  render();
  return true;
}

function cancelBook(uid,bookKey){
  const item=getOwned(uid);
  if(!item || !(item.books||[]).includes(bookKey)){
    toast("📖 その本は付いていません");
    return false;
  }
  if(!spendGold(BOOK_CANCEL_COST)){
    toast("💰 本の取り消しには1000G必要です");
    return false;
  }
  item.books=item.books.filter(x=>x!==bookKey);
  saveGame();
  render();
  toast("📖 本を取り消しました（1000G）");
  return true;
}

function statsOf(item){
  const c=getCharacter(item.id);
  let hp=(c.hp + item.star*2)*7;
  let power=c.power + item.star*2;
  const books=item.books||[];

  if(books.includes("hpUp")) hp*=1.3;
  if(books.includes("extremeHpUp")) hp*=1.75;
  if(books.includes("attackUp")) power*=1.3;
  if(books.includes("extremeAttackUp")) power*=1.75;

  return {
    hp:Math.round(hp),
    power:Math.round(power)
  };
}


function spendGold(amount){
  if(gold<amount)return false;
  gold-=amount;
  return true;
}

function refreshShop(){
  const slot=Math.floor((new Date().getHours()*60+new Date().getMinutes())/30);
  if(shopSlot===slot && shopBooks.length===3)return;
  const keys=Object.keys(SKILL_BOOKS);
  shopBooks=[...keys].sort(()=>Math.random()-.5).slice(0,3);
  shopSlot=slot;
  saveGame();
}

function renderShop(){
  refreshShop();
  const box=document.getElementById("shopBooks");
  if(!box)return;

  let html="<div class='small'>💰 所持ゴールド：<b>"+gold+"G</b></div>";
  html+="<div class='character-grid' style='margin-top:8px'>";
  shopBooks.forEach(key=>{
    const book=SKILL_BOOKS[key];
    html+="<div class='card'>"+
      "<div class='card-name'>📖 "+book.name+"</div>"+
      "<div class='card-info'>"+book.effect+"<br>💰 "+book.price+"G</div>"+
      "<button onclick=\"buyBook('"+key+"')\">購入</button>"+
      "</div>";
  });
  html+="</div>";
  box.innerHTML=html;
}

function buyBook(bookKey){
  const book=SKILL_BOOKS[bookKey];
  if(!book)return;
  if(gold<book.price){
    toast("💰 ゴールドが足りません");
    return;
  }

  showModal(
    "📖 スキルの本",
    book.name+" を誰に付けますか？\n"+book.effect+"\n価格："+book.price+"G",
    inventory.map(item=>{
      const c=getCharacter(item.id);
      const full=(item.books||[]).length>=MAX_BOOKS_PER_CHARACTER;
      return [
        c.name+" ★"+item.star+(full?"（本3個）":""),
        ()=>{
          closeModal();
          if(full){
            toast("📖 そのキャラは本が3個でいっぱいです");
            return;
          }
          if(!spendGold(book.price))return;
          addBookToCharacter(item.uid,bookKey);
          toast("📖 "+c.name+" に本を付けました！");
        }
      ];
    }).concat([["キャンセル",closeModal]])
  );
}

function render(){
  renderEventBanner();
  renderShop();
  renderEnemy();
  renderTotals();
  renderInventory();
  renderEncyclopedia();
  renderMachine();
  renderFuseMachine();
}

function renderEventBanner(){
  const box=document.getElementById("eventBanner");
  if(adminEventState.active)return;
  const events=getActiveEvents();
  if(!events.length){
    box.innerHTML="🕒 <b>変異イベントなし</b>　現在は通常状態です。";
    return;
  }
  box.innerHTML="<span class='event-active'>🔥 変異イベント中！ "+events.map(e=>e.name).join(" / ")+"</span><br>"+
    "<span class='small'>敵撃破時、30%で変異付与。複数変異も発生します。</span>";
}

function getActiveEvents(now=new Date()){
  const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  const minute=h*60+m+s/60;
  const active=[];
  // 13:00〜13:02
  if(minute>=13*60 && minute<13*60+2) active.push(MUTATIONS.demon);
  // 16:00〜16:15
  if(minute>=16*60 && minute<16*60+15) active.push(MUTATIONS.sun);
  // 16:30〜16:45
  if(minute>=16*60+30 && minute<16*60+45) active.push(MUTATIONS.rain);
  // 17:00〜17:15
  if(minute>=17*60 && minute<17*60+15) active.push(MUTATIONS.fire);
  // 18:00〜18:15
  if(minute>=18*60 && minute<18*60+15) active.push(MUTATIONS.snow);
  // 19:00〜19:15
  if(minute>=19*60 && minute<19*60+15) active.push(MUTATIONS.sun,MUTATIONS.rain);
  // 20:00〜20:15
  if(minute>=20*60 && minute<20*60+15) active.push(MUTATIONS.fire,MUTATIONS.snow);
  // 20:30〜20:45
  if(minute>=20*60+30 && minute<20*60+45) active.push(MUTATIONS.sun,MUTATIONS.rain,MUTATIONS.fire,MUTATIONS.snow);
  return active;
}

function mutationKeyPool(){
  return getActiveEvents().map(x=>x.key);
}

function rollMutations(){
  const pool=mutationKeyPool();
  if(!pool.length) return [];
  if(Math.random()>=0.30) return [];

  // 30%の変異付与判定に成功した後、
  // 2/3/4個の確率は確定値。残りは1個。
  let count=1;
  const r=Math.random()*100;
  if(r<2) count=4;
  else if(r<8) count=3;
  else if(r<23) count=2;
  count=Math.min(count,pool.length);

  return [...pool].sort(()=>Math.random()-.5).slice(0,count);
}

function inheritMutations(items){
  const all=[...new Set(items.flatMap(x=>x.mutations||[]))];
  return all.filter(key=>Math.random()<0.70);
}

function renderEnemy(){
  const es=document.getElementById("enemyStats");
  const img=document.getElementById("enemyImage");
  if(!enemy){
    es.innerHTML="<div class='small'>敵を準備中...</div>";
    img.removeAttribute("src");
    return;
  }
  es.innerHTML=
    "<div class='stat'>🧠 "+enemy.name+"</div>"+
    "<div class='stat'>❤️ HP：<b>"+enemy.currentHP+" / "+enemy.hp+"</b></div>"+
    "<div class='stat'>⚔️ 火力：<b>"+enemy.power+"</b></div>"+
    "<div class='stat'>⭐ "+enemy.rarity+"</div>"+
    mutationHTML(enemy.mutations);
  img.src=imageSrc(getCharacter(enemy.id));
}

function renderTotals(){
  let hp=0,power=0,names=[];
  for(const uid of equipped){
    const item=getOwned(uid);
    if(!item) continue;
    const s=statsOf(item);
    const c=getCharacter(item.id);
    hp+=s.hp; power+=s.power;
    names.push(c.name+" ★"+item.star+(item.mutations?.length?" "+mutationNames(item.mutations).join(" "):""));
  }
  document.getElementById("totalStats").innerHTML="❤️ HP：<b>"+hp+"</b>　⚔️ 火力：<b>"+power+"</b>";
  document.getElementById("equippedNames").textContent=names.length?"装備中： "+names.join(" / "):"装備なし";
}

function renderInventory(){
  const box=document.getElementById("characterList");
  if(!inventory.length){box.innerHTML="<div class='small'>所持キャラなし</div>";return}
  box.innerHTML="";
  inventory.forEach(item=>{
    const c=getCharacter(item.id);
    const s=statsOf(item);
    const isEq=equipped.includes(item.uid);
    const div=document.createElement("div");
    div.className="card"+(isEq?" equipped":"");
    div.innerHTML=
      "<img src='"+imageSrc(c)+"' alt='"+c.name+"'>"+
      "<div class='card-name'>"+c.name+"</div>"+
      "<div class='card-info'>⭐ ★"+item.star+"<br>レア度："+c.rarity+
      "<br>❤️ HP："+s.hp+"<br>⚔️ 火力："+s.power+
      "<br>🔥 Fuse P："+c.fusePoint+"</div>"+
      mutationHTML(item.mutations)+
      bookHTML(item.books)+
      "<button onclick=\"toggleEquip('"+item.uid+"')\">"+(isEq?"装備解除":"装備")+"</button>"+
      "<button onclick=\"sellCharacter('"+item.uid+"')\" class='danger'>売却</button>";
    box.appendChild(div);
  });
}

function renderEncyclopedia(){
  const box=document.getElementById("encyclopedia");
  box.innerHTML="";
  characters.forEach(c=>{
    const found=inventory.some(x=>x.id===c.id);
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=found
      ? "<img src='"+imageSrc(c)+"' alt='"+c.name+"'><div class='card-name'>"+c.name+
        "</div><div class='card-info'>⭐ "+c.rarity+"<br>❤️ HP："+c.hp+
        "<br>⚔️ 火力："+c.power+"<br>🔥 Fuse P："+c.fusePoint+"</div>"
      : "<div style='height:110px;display:flex;align-items:center;justify-content:center;font-size:45px'>❓</div>"+
        "<div class='card-name'>？？？</div><div class='card-info'>未入手</div>";
    box.appendChild(div);
  });
}

function openMachine(){
  if(battleRunning){toast("バトル中は合体できません");return}
  document.getElementById("machine").classList.add("open");
  machineSelection=[];
  renderMachine();
}
function closeMachine(){
  document.getElementById("machine").classList.remove("open");
  machineSelection=[];
}
function renderMachine(){
  const box=document.getElementById("machineList");
  if(!box)return;
  box.innerHTML="";
  inventory.forEach(item=>{
    const c=getCharacter(item.id);
    const div=document.createElement("button");
    div.className="select-card"+(machineSelection.includes(item.uid)?" selected":"");
    div.innerHTML="<img src='"+imageSrc(c)+"'><b>"+c.name+"</b><br>★"+item.star+mutationHTML(item.mutations)+bookHTML(item.books);
    div.onclick=()=>selectForFusion(item.uid);
    box.appendChild(div);
  });
}
function selectForFusion(uid){
  if(machineSelection.includes(uid)) machineSelection=machineSelection.filter(x=>x!==uid);
  else{
    if(machineSelection.length>=2) machineSelection=[];
    machineSelection.push(uid);
  }
  renderMachine();
}
function fuseSelected(){
  if(machineSelection.length!==2){toast("同じキャラ・同じ★数を2体選択してください");return}
  const a=getOwned(machineSelection[0]),b=getOwned(machineSelection[1]);
  if(!a||!b)return;
  if(a.id!==b.id){toast("同じキャラ同士でのみ合体できます");return}
  if(a.star!==b.star){toast("同じ★数同士でのみ合体できます");return}
  if(a.star>=10){toast("★10が最大です");return}

  const newStar=a.star+1;
  const inherited=inheritMutations([a,b]);
  const inheritedBooks=inheritBooksForFusion(a,b);
  inventory=inventory.filter(x=>x.uid!==a.uid&&x.uid!==b.uid);
  equipped=equipped.filter(x=>x!==a.uid&&x!==b.uid);
  delete battleHP[a.uid];delete battleHP[b.uid];

  const newItem={uid:uid(),id:a.id,star:newStar,mutations:inherited,books:inheritedBooks};
  inventory.push(newItem);
  saveGame();
  machineSelection=[];
  render();
  toast("✨ "+getCharacter(a.id).name+" が★"+newStar+"になりました！"+(inherited.length?" 🧬変異引き継ぎ！":""));
}

function openFuseMachine(){
  if(battleRunning){toast("バトル中はヒューズできません");return}
  document.getElementById("fuseMachine").classList.add("open");
  fuseSelection=[];
  renderFuseMachine();
}
function closeFuseMachine(){
  document.getElementById("fuseMachine").classList.remove("open");
  fuseSelection=[];
}
function fuseTableFor(points){
  return FUSE_TABLE.find(t=>points>=t.min&&points<=t.max)||FUSE_TABLE[FUSE_TABLE.length-1];
}
function fuseProbabilities(points){
  return fuseTableFor(points).rows.map(([id,rate])=>({id,rate,c:getCharacter(id)}));
}
function renderFuseMachine(){
  const box=document.getElementById("fuseList");
  if(!box)return;
  const points=fuseSelection.reduce((sum,uid)=>{
    const item=getOwned(uid);return sum+(item?getCharacter(item.id).fusePoint:0);
  },0);
  document.getElementById("fuseSelectionInfo").innerHTML=
    "<b>投入："+fuseSelection.length+" / 5体</b>　🔥 合計Fuse Point：<b>"+points+"P</b>";

  const probs=fuseProbabilities(Math.max(1,points));
  document.getElementById("fuseProbability").innerHTML=
    "<b>🎯 合成結果の確率</b>"+
    probs.map(x=>"<div class='prob-row'><span>"+x.c.name+"</span><b>"+x.rate+"%</b></div>").join("")+
    "<div class='small'>※41P以上では現時点でスパゲッティトイレは対象外。</div>";

  box.innerHTML="";
  inventory.forEach(item=>{
    const c=getCharacter(item.id);
    const div=document.createElement("button");
    div.className="select-card"+(fuseSelection.includes(item.uid)?" selected":"");
    div.innerHTML="<img src='"+imageSrc(c)+"'><b>"+c.name+"</b><br>★"+item.star+"<br>🔥 "+c.fusePoint+"P"+mutationHTML(item.mutations)+bookHTML(item.books);
    div.onclick=()=>selectForFuseMachine(item.uid);
    box.appendChild(div);
  });
}
function selectForFuseMachine(uid){
  if(fuseSelection.includes(uid)){
    fuseSelection=fuseSelection.filter(x=>x!==uid);
  }else{
    if(fuseSelection.length>=5){toast("ヒューズは5体までです");return}
    fuseSelection.push(uid);
  }
  renderFuseMachine();
}
function weightedChoice(rows){
  const r=Math.random()*100;
  let acc=0;
  for(const [id,rate] of rows){
    acc+=rate;
    if(r<acc)return id;
  }
  return rows[rows.length-1][0];
}
function fuseMachineExecute(){
  if(fuseSelection.length!==5){toast("ヒューズには5体必要です");return}
  const inputs=fuseSelection.map(getOwned).filter(Boolean);
  if(inputs.length!==5){toast("選択キャラを確認してください");return}

  const points=inputs.reduce((sum,item)=>sum+getCharacter(item.id).fusePoint,0);
  const table=fuseTableFor(points);
  const resultId=weightedChoice(table.rows);
  const inherited=inheritMutations(inputs);

  const selectedIds=new Set(fuseSelection);
  inventory=inventory.filter(x=>!selectedIds.has(x.uid));
  equipped=equipped.filter(x=>!selectedIds.has(x));
  fuseSelection.forEach(x=>delete battleHP[x]);

  const newItem={uid:uid(),id:resultId,star:0,mutations:inherited,books:[]};
  inventory.push(newItem);
  saveGame();
  const result=getCharacter(resultId);
  fuseSelection=[];
  render();
  showModal(
    "🔥 ヒューズ成功！",
    result.name+" を獲得！\n合計Fuse Point："+points+"P\n変異："+(inherited.length?mutationNames(inherited).join(" / "):"なし"),
    [["OK",closeModal]]
  );
}

function toggleEquip(uid){
  if(equipped.includes(uid)){
    equipped=equipped.filter(x=>x!==uid);
    delete battleHP[uid];
  }else{
    if(equipped.length>=3){toast("装備できるのは3体までです");return}
    equipped.push(uid);
  }
  saveGame();render();
}

function sellCharacter(uid){
  const item=getOwned(uid);if(!item)return;
  const c=getCharacter(item.id);
  if(c.rarity==="ゴット"){
    confirmTwoStep("ゴットキャラの売却",c.name+" ★"+item.star+" を売却しますか？",()=>{
      confirmTwoStep("最終確認","本当に売却しますか？この操作は元に戻せません。",()=>doSell(uid));
    });
  }else confirmOne("キャラの売却",c.name+" ★"+item.star+" を売却しますか？",()=>doSell(uid));
}
function doSell(uid){
  inventory=inventory.filter(x=>x.uid!==uid);
  equipped=equipped.filter(x=>x!==uid);
  delete battleHP[uid];
  saveGame();render();toast("🗑️ 売却しました");
}
function confirmOne(title,text,ok){
  showModal(title,text,[["キャンセル",closeModal],["売却する",()=>{closeModal();ok()}]]);
}
function confirmTwoStep(title,text,ok){
  showModal(title,text,[["キャンセル",closeModal],["確認する",()=>{closeModal();ok()}]]);
}
function showModal(title,text,buttons){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalText").textContent=text;
  const box=document.getElementById("modalButtons");box.innerHTML="";
  buttons.forEach(([label,fn])=>{
    const b=document.createElement("button");b.textContent=label;b.onclick=fn;box.appendChild(b);
  });
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){document.getElementById("modalBg").classList.remove("show")}

function weightedRarity(){
  const r=Math.random()*100;
  if(r<70)return "コモン";
  if(r<90)return "レア";
  if(r<99)return "ゴット";
  return "シークレット";
}
function pickSecret(){
  return weightedChoice(SECRET_RATES);
}
function createEnemy(){
  const rarity=weightedRarity();
  let c;
  if(rarity==="シークレット"){
    c=getCharacter(pickSecret());
  }else{
    const pool=characters.filter(x=>x.rarity===rarity);
    c=pool[Math.floor(Math.random()*pool.length)];
  }
  enemy={
    id:c.id,name:c.name,rarity:c.rarity,image:c.image,
    hp:c.hp*23,currentHP:c.hp*23,power:c.power,
    mutations:[]
  };
  renderEnemy();
}

function resetBattleHP(){
  battleHP={};
  equipped.forEach(uid=>{
    const item=getOwned(uid);
    if(item)battleHP[uid]=statsOf(item).hp;
  });
}

function startBattle(){
  if(battleRunning)return;
  if(equipped.length===0){toast("キャラを1体以上装備してください");return}
  battleRunning=true;
  resetBattleHP();
  createEnemy();
  log("⚔️ バトル開始！");
  battleTimer=setInterval(playerAttack,1000);
  enemyTimer=setInterval(enemyAttack,1000);
}

function stopBattle(){
  battleRunning=false;
  clearInterval(battleTimer);clearInterval(enemyTimer);
  battleTimer=null;enemyTimer=null;
}

function playerAttack(){
  if(!battleRunning||!enemy)return;
  let damage=0;
  equipped.forEach(uid=>{
    const item=getOwned(uid);
    if(item&&battleHP[uid]>0)damage+=statsOf(item).power;
  });
  if(damage<=0)return;
  enemy.currentHP-=damage;
  log("⚔️ 味方が合計"+damage+"ダメージ！");
  if(enemy.currentHP<=0){winEnemy();return}
  renderEnemy();
}

function enemyAttack(){
  if(!battleRunning||!enemy)return;
  const active=equipped.map(uid=>getOwned(uid)).filter(item=>item&&battleHP[item.uid]>0);
  if(!active.length){loseBattle();return}
  active.forEach(target=>{
    battleHP[target.uid]-=enemy.power;
    log("👹 "+enemy.name+" → "+getCharacter(target.id).name+" に "+enemy.power+" ダメージ！");
  });
  renderBattleHP();
  const alive=active.filter(target=>battleHP[target.uid]>0);
  if(alive.length===0){loseBattle();return}
  active.forEach(target=>{
    if(battleHP[target.uid]<=0)log("💥 "+getCharacter(target.id).name+" が倒された！");
  });
}

function renderBattleHP(){renderTotals();renderInventory()}

function loseBattle(){
  stopBattle();
  log("💀 3体全員が倒されました……");
  toast("💀 敗北！");
}

function winEnemy(){
  const defeated=getCharacter(enemy.id);
  stopBattle();
  log("🏆 "+defeated.name+" を撃破！");
  const goldReward={コモン:1,レア:3,ゴット:30,シークレット:150}[defeated.rarity]||0;
  gold+=goldReward;
  log("💰 "+goldReward+"G 獲得！");

  // 変異イベントは「敵を倒した瞬間」に判定
  const mutations=rollMutations();
  if(mutations.length){
    log("🧬 "+mutationNames(mutations).join(" / ")+" が発生！");
  }

  const roll=Math.random();
  const effectiveDrop=Math.min(1,defeated.drop*serverLuckMultiplier());
  if(roll<effectiveDrop){
    const item={uid:uid(),id:defeated.id,star:0,mutations,books:[]};
    inventory.push(item);
    saveGame();
    showDrop(defeated,item);
  }else{
    if(mutations.length) log("🧬 変異は付いたが、ドロップしませんでした。");
    toast("😢 ドロップしませんでした");
    setTimeout(()=>startBattle(),500);
  }
}

function showDrop(c,item){
  document.getElementById("dropImage").src=imageSrc(c);
  document.getElementById("dropName").textContent=c.name;
  document.getElementById("dropInfo").innerHTML=
    "⭐ "+c.rarity+" を獲得！"+mutationHTML(item.mutations);
  document.getElementById("dropOverlay").classList.add("show");
  render();
}
function closeDrop(){
  document.getElementById("dropOverlay").classList.remove("show");
  startBattle();
}

function log(text){
  const box=document.getElementById("battleLog");
  box.innerHTML+="<div>"+new Date().toLocaleTimeString()+"　"+text+"</div>";
  box.scrollTop=box.scrollHeight;
}
function toast(text){
  const t=document.getElementById("toast");
  t.textContent=text;t.style.display="block";
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.style.display="none",1800);
}


function adminEventKey(now=new Date()){
  const d=new Date(now);
  const day=d.getDay();
  const minutes=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
  const sundayWeekly=(day===0 && minutes>=18*60+30 && minutes<18*60+40);
  const todayMorning=(d.getFullYear()===2026 && d.getMonth()===8 && d.getDate()===1 &&
    minutes>=5*60+15 && minutes<5*60+25);
  if(sundayWeekly)return "weekly-"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  if(todayMorning)return "today-2026-09-01-0515";
  return "";
}

function isAdminEvent(now=new Date()){
  return !!adminEventKey(now);
}

    "どうだ！3倍ラックだ！",

    "変異が足りない？",

    "だからやらない",
    "なんだって？",

    "さすがにダメです",

function showAdminMessage(message){
  const box=document.getElementById("eventBanner");
  box.innerHTML="<div style='font-size:20px;text-align:center;font-weight:bold'>"+message+"</div>";
  setTimeout(()=>{
    if(isAdminEvent()){
      box.innerHTML="";
    }
  },7000);
}

function startAdminEvent(){
  const key=adminEventKey();
  if(!key || adminEventState.startedKey===key)return;

  adminEventState.startedKey=key;
  adminEventState.active=true;

  const messages=adminMessages();
  let i=0;

  const next=()=>{
    if(i>=messages.length)return;
    showAdminMessage(messages[i++]);
    setTimeout(next,10000); // 7秒表示→3秒後に次
  };
  next();
}

function spawnSwagMangoAfterAdmin(){
  const c=getCharacter("swagmango");
  if(!c)return;

  enemy={
    id:c.id,name:c.name,rarity:c.rarity,image:c.image,
    hp:c.hp*23,currentHP:c.hp*23,power:c.power,
    mutations:[]
  };
  renderEnemy();
  log("🥭 管理者イベント終了！スワッグマンゴーが敵として出現！");
}

function updateAdminEvent(){
  const active=isAdminEvent();

  if(active && !adminEventState.active){
    startAdminEvent();
  }

  if(!active && adminEventState.active){
    adminEventState.active=false;
    const now=new Date();
    const key=adminEventKey(now);
    // adminEventKeyは終了後に空になるので、直前の開始キーを使う。
    if(adminEventState.endSpawnedKey!==adminEventState.startedKey){
      adminEventState.endSpawnedKey=adminEventState.startedKey;
      spawnSwagMangoAfterAdmin();
    }
  }
}

function serverLuckMultiplier(){
  return adminEventState.active?5:1;
}

function updateEventLoop(){
  updateAdminEvent();
  renderEventBanner();
  renderShop();
}
loadGame();
render();
eventTimer=setInterval(updateEventLoop,1000);
</script>
