<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バトル・ザ・ブレインロット</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#111;
  color:#fff;
  min-height:100vh;
}
button{font:inherit;cursor:pointer}
#app{max-width:1100px;margin:auto;padding:12px}
.panel{
  background:#202020;
  border:2px solid #444;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}
h1,h2,h3{margin:5px 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.enemy-area{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:12px;
}
.enemy-image{
  width:100%;
  height:260px;
  object-fit:contain;
  background:#090909;
  border-radius:12px;
}
.stat{
  font-size:18px;
  margin:7px 0;
}
#totalStats{
  font-size:20px;
  text-align:center;
}
.character-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:10px;
}
.card{
  background:#2c2c2c;
  border:2px solid #555;
  border-radius:12px;
  padding:8px;
  position:relative;
}
.card.equipped{border-color:#fff;box-shadow:0 0 0 2px #fff inset}
.card img{
  width:100%;
  height:110px;
  object-fit:contain;
  background:#111;
  border-radius:8px;
}
.card-name{font-weight:bold;margin:5px 0;font-size:14px}
.card-info{font-size:13px;line-height:1.5}
.badge{
  display:inline-block;
  padding:2px 7px;
  border-radius:20px;
  background:#555;
  font-size:12px;
}
.card button,.main-btn{
  border:0;
  border-radius:9px;
  padding:8px 10px;
  margin-top:7px;
  background:#444;
  color:#fff;
}
.main-btn{background:#fff;color:#111;font-weight:bold}
.card button:hover,.main-btn:hover{opacity:.85}
.small{font-size:12px;color:#bbb}
#battleLog{
  height:90px;
  overflow:auto;
  background:#0b0b0b;
  padding:8px;
  border-radius:8px;
  font-size:13px;
}
.machine{
  display:none;
  margin-top:10px;
  background:#151515;
  border:2px solid #555;
  border-radius:12px;
  padding:12px;
}
.machine.open{display:block}
.machine-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;
}
.select-card{
  border:2px solid #555;
  background:#292929;
  color:#fff;
  border-radius:10px;
  padding:7px;
}
.select-card.selected{border-color:#fff}
.select-card img{width:100%;height:80px;object-fit:contain}
#toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#fff;
  color:#111;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
  display:none;
  z-index:50;
}
.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:40;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-bg.show{display:flex}
.modal{
  max-width:430px;
  width:100%;
  background:#222;
  border:2px solid #666;
  border-radius:15px;
  padding:18px;
}
.modal button{padding:9px 13px;border:0;border-radius:9px;margin:5px}
.danger{background:#d33!important;color:#fff}
#dropOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:35;
  align-items:center;
  justify-content:center;
  text-align:center;
}
#dropOverlay.show{display:flex}
.drop-box{
  animation:pop .45s ease;
  background:#222;
  border:3px solid #fff;
  border-radius:20px;
  padding:25px;
  max-width:420px;
}
.drop-box img{width:220px;height:180px;object-fit:contain}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@media(max-width:700px){
  .enemy-area{grid-template-columns:1fr}
  .enemy-image{height:210px}
}
</style>
</head>
<body>
<div id="app">
  <div class="panel">
    <h1>🧠⚔️ バトル・ザ・ブレインロット</h1>
    <div class="small">最大3体を装備して自動バトル！</div>
  </div>

  <!-- 1. 敵のステータス -->
  <div class="panel">
    <h2>① 👹 敵のステータス</h2>
    <div id="enemyStats"></div>
  </div>

  <!-- 2. 敵の画像 -->
  <div class="panel">
    <h2>② 🖼️ 敵の画像</h2>
    <img id="enemyImage" class="enemy-image" alt="敵Brainrot">
  </div>

  <!-- 6. 使用キャラの合計ステータス -->
  <div class="panel">
    <h2>⑥ 📊 使用キャラの合計ステータス</h2>
    <div id="totalStats"></div>
    <div id="equippedNames" class="small" style="text-align:center"></div>
  </div>

  <div class="panel">
    <h2>⚔️ バトル</h2>
    <div class="row">
      <button class="main-btn" onclick="startBattle()">▶ バトル開始</button>
      <button class="main-btn" onclick="stopBattle()">⏸ 停止</button>
      <button class="main-btn" onclick="openMachine()">⚙️ 合体マシン</button>
    </div>
    <div id="battleLog"></div>
  </div>

  <!-- 3. 所持キャラ一覧 -->
  <div class="panel">
    <h2>③ 🧠 所持キャラ一覧</h2>
    <div id="characterList" class="character-grid"></div>
  </div>

  <!-- 4. 合体マシン -->
  <div class="panel">
    <h2>④ ⚙️ 合体マシン</h2>
    <div class="small">同じキャラ・同じ★数の2体を選択して合体できます。最大★10。</div>
    <div id="machine" class="machine">
      <div id="machineList" class="machine-grid"></div>
      <div class="row" style="margin-top:10px">
        <button class="main-btn" onclick="fuseSelected()">⚙️ 合体する</button>
        <button class="main-btn" onclick="closeMachine()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 5. キャラ図鑑 -->
  <div class="panel">
    <h2>⑤ 📖 キャラ図鑑</h2>
    <div id="encyclopedia" class="character-grid"></div>
  </div>
</div>

<div id="toast"></div>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalText"></div>
    <div id="modalButtons"></div>
  </div>
</div>

<div id="dropOverlay">
  <div class="drop-box">
    <h2>🎉 ドロップ！！ 🎉</h2>
    <img id="dropImage" alt="獲得Brainrot">
    <h2 id="dropName"></h2>
    <div id="dropInfo"></div>
    <button class="main-btn" onclick="closeDrop()">GET！</button>
  </div>
</div>

<script>
/*
  セーブキー固定：
  "battleTheBrainrotSave"
*/
const SAVE_KEY = "battleTheBrainrotSave";

const characters = [
  {id:"buruburu", name:"ブルブルパタピム", rarity:"コモン", hp:10, power:10, image:"IMG_3216.jpeg", drop:1},
  {id:"tralalero", name:"トララレロトラララ", rarity:"コモン", hp:15, power:7, image:"IMG_3214.jpeg", drop:1},
  {id:"tung", name:"トゥントゥントゥンサフール", rarity:"コモン", hp:7, power:13, image:"IMG_3215.jpeg", drop:1},
  {id:"job", name:"ジョブジョブサフール", rarity:"レア", hp:15, power:15, image:"IMG_3220.png", drop:.30},
  {id:"garama", name:"ガラマ＆マドゥンドゥン", rarity:"レア", hp:14, power:16, image:"IMG_3219.png", drop:.30},
  {id:"aaa", name:"AAAサフール", rarity:"ゴット", hp:20, power:15, image:"IMG_3218.png", drop:.05},
  {id:"bros", name:"ロスブロス", rarity:"ゴット", hp:17, power:18, image:"IMG_3217.webp", drop:.05}
];

let inventory = [];
let equipped = [];
let enemy = null;
let battleTimer = null;
let enemyTimer = null;
let battleRunning = false;
let machineSelection = [];
let battleHP = {};

function defaultInventory(){
  return [
    {uid:crypto.randomUUID(), id:"buruburu", star:0},
    {uid:crypto.randomUUID(), id:"tralalero", star:0},
    {uid:crypto.randomUUID(), id:"tung", star:0}
  ];
}

function saveGame(){
  const data = {inventory, equipped};
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){
      inventory = defaultInventory();
      equipped = inventory.map(x=>x.uid);
      saveGame();
      log("🎁 初回プレイ！コモン3種を獲得！");
    }else{
      const data = JSON.parse(raw);
      inventory = Array.isArray(data.inventory) ? data.inventory : defaultInventory();
      equipped = Array.isArray(data.equipped) ? data.equipped : [];
    }
  }catch(e){
    inventory = defaultInventory();
    equipped = inventory.map(x=>x.uid);
    saveGame();
  }
}

function getCharacter(id){
  return characters.find(c=>c.id===id);
}

function getOwned(uid){
  return inventory.find(x=>x.uid===uid);
}

function statsOf(item){
  const c=getCharacter(item.id);
  return {
    hp:(c.hp + item.star*2) * 7,
    power:c.power + item.star*2
  };
}

function render(){
  renderEnemy();
  renderTotals();
  renderInventory();
  renderEncyclopedia();
  renderMachine();
}

function renderEnemy(){
  const es=document.getElementById("enemyStats");
  const img=document.getElementById("enemyImage");
  if(!enemy){
    es.innerHTML="<div class='small'>敵を準備中...</div>";
    img.removeAttribute("src");
    return;
  }
  es.innerHTML=
    "<div class='stat'>🧠 "+enemy.name+"</div>"+
    "<div class='stat'>❤️ HP：<b>"+enemy.currentHP+" / "+enemy.hp+"</b></div>"+
    "<div class='stat'>⚔️ 火力：<b>"+enemy.power+"</b></div>"+
    "<div class='stat'>⭐ "+enemy.rarity+"</div>";
  img.src=enemy.image;
}

function renderTotals(){
  let hp=0,power=0,names=[];
  for(const uid of equipped){
    const item=getOwned(uid);
    if(!item) continue;
    const s=statsOf(item);
    const c=getCharacter(item.id);
    hp+=s.hp; power+=s.power;
    names.push(c.name+" ★"+item.star);
  }
  document.getElementById("totalStats").innerHTML=
    "❤️ HP：<b>"+hp+"</b>　⚔️ 火力：<b>"+power+"</b>";
  document.getElementById("equippedNames").textContent=
    names.length ? "装備中： "+names.join(" / ") : "装備なし";
}

function renderInventory(){
  const box=document.getElementById("characterList");
  if(!inventory.length){
    box.innerHTML="<div class='small'>所持キャラなし</div>";
    return;
  }
  box.innerHTML="";
  inventory.forEach(item=>{
    const c=getCharacter(item.id);
    const s=statsOf(item);
    const isEq=equipped.includes(item.uid);
    const div=document.createElement("div");
    div.className="card"+(isEq?" equipped":"");
    div.innerHTML=
      "<img src='"+c.image+"' alt='"+c.name+"'>"+
      "<div class='card-name'>"+c.name+"</div>"+
      "<div class='card-info'>⭐ ★"+item.star+"<br>レア度："+c.rarity+
      "<br>❤️ HP："+s.hp+"<br>⚔️ 火力："+s.power+"</div>"+
      "<button onclick=\"toggleEquip('"+item.uid+"')\">"+
      (isEq?"装備解除":"装備")+"</button>"+
      "<button onclick=\"sellCharacter('"+item.uid+"')\" class='danger'>売却</button>";
    box.appendChild(div);
  });
}

function renderEncyclopedia(){
  const box=document.getElementById("encyclopedia");
  box.innerHTML="";
  characters.forEach(c=>{
    const found=inventory.some(x=>x.id===c.id);
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=found
      ? "<img src='"+c.image+"' alt='"+c.name+"'><div class='card-name'>"+c.name+
        "</div><div class='card-info'>⭐ "+c.rarity+"<br>❤️ HP："+c.hp+
        "<br>⚔️ 火力："+c.power+"</div>"
      : "<div style='height:110px;display:flex;align-items:center;justify-content:center;font-size:45px'>❓</div>"+
        "<div class='card-name'>？？？</div><div class='card-info'>未入手</div>";
    box.appendChild(div);
  });
}

function openMachine(){
  document.getElementById("machine").classList.add("open");
  machineSelection=[];
  renderMachine();
}

function closeMachine(){
  document.getElementById("machine").classList.remove("open");
  machineSelection=[];
}

function renderMachine(){
  const box=document.getElementById("machineList");
  if(!box) return;
  box.innerHTML="";
  inventory.forEach(item=>{
    const c=getCharacter(item.id);
    const div=document.createElement("button");
    div.className="select-card"+(machineSelection.includes(item.uid)?" selected":"");
    div.innerHTML="<img src='"+c.image+"'><b>"+c.name+"</b><br>★"+item.star;
    div.onclick=()=>selectForFusion(item.uid);
    box.appendChild(div);
  });
}

function selectForFusion(uid){
  if(machineSelection.includes(uid)){
    machineSelection=machineSelection.filter(x=>x!==uid);
  }else{
    if(machineSelection.length>=2) machineSelection=[];
    machineSelection.push(uid);
  }
  renderMachine();
}

function fuseSelected(){
  if(machineSelection.length!==2){
    toast("同じキャラ・同じ★数を2体選択してください");
    return;
  }
  const a=getOwned(machineSelection[0]);
  const b=getOwned(machineSelection[1]);
  if(!a||!b) return;
  if(a.id!==b.id){
    toast("同じキャラ同士でのみ合体できます");
    return;
  }
  if(a.star!==b.star){
    toast("同じ★数同士でのみ合体できます");
    return;
  }
  if(a.star>=10){
    toast("★10が最大です");
    return;
  }
  const newStar=a.star+1;
  inventory=inventory.filter(x=>x.uid!==a.uid && x.uid!==b.uid);
  equipped=equipped.filter(x=>x!==a.uid && x!==b.uid);
  delete battleHP[a.uid];
  delete battleHP[b.uid];
  const newItem={uid:crypto.randomUUID(),id:a.id,star:newStar};
  inventory.push(newItem);
  saveGame();
  machineSelection=[];
  render();
  toast("✨ "+getCharacter(a.id).name+" が★"+newStar+"になりました！");
}

function toggleEquip(uid){
  if(equipped.includes(uid)){
    equipped=equipped.filter(x=>x!==uid);
    delete battleHP[uid];
  }else{
    if(equipped.length>=3){
      toast("装備できるのは3体までです");
      return;
    }
    equipped.push(uid);
  }
  saveGame();
  render();
}

function sellCharacter(uid){
  const item=getOwned(uid);
  if(!item) return;
  const c=getCharacter(item.id);
  if(c.rarity==="ゴット"){
    confirmTwoStep(
      "ゴットキャラの売却",
      c.name+" ★"+item.star+" を売却しますか？",
      ()=>{
        confirmTwoStep(
          "最終確認",
          "本当に売却しますか？この操作は元に戻せません。",
          ()=>doSell(uid)
        );
      }
    );
  }else{
    confirmOne(
      "キャラの売却",
      c.name+" ★"+item.star+" を売却しますか？",
      ()=>doSell(uid)
    );
  }
}

function doSell(uid){
  inventory=inventory.filter(x=>x.uid!==uid);
  equipped=equipped.filter(x=>x!==uid);
  delete battleHP[uid];
  saveGame();
  render();
  toast("🗑️ 売却しました");
}

function confirmOne(title,text,ok){
  showModal(title,text,
    [["キャンセル",closeModal],["売却する",()=>{closeModal();ok();}]]
  );
}

function confirmTwoStep(title,text,ok){
  showModal(title,text,
    [["キャンセル",closeModal],["確認する",()=>{closeModal();ok();}]]
  );
}

function showModal(title,text,buttons){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalText").textContent=text;
  const box=document.getElementById("modalButtons");
  box.innerHTML="";
  buttons.forEach(([label,fn])=>{
    const b=document.createElement("button");
    b.textContent=label;
    b.onclick=fn;
    box.appendChild(b);
  });
  document.getElementById("modalBg").classList.add("show");
}
function closeModal(){document.getElementById("modalBg").classList.remove("show")}

function weightedRarity(){
  const r=Math.random()*100;
  if(r<70) return "コモン";
  if(r<90) return "レア";
  return "ゴット";
}

function createEnemy(){
  const rarity=weightedRarity();
  const pool=characters.filter(c=>c.rarity===rarity);
  const c=pool[Math.floor(Math.random()*pool.length)];
  enemy={
    id:c.id,name:c.name,rarity:c.rarity,image:c.image,
    hp:c.hp*23,
    currentHP:c.hp*23,
    power:(c.power/10)*10
  };
  renderEnemy();
}

function resetBattleHP(){
  battleHP={};
  equipped.forEach(uid=>{
    const item=getOwned(uid);
    if(item) battleHP[uid]=statsOf(item).hp;
  });
}

function startBattle(){
  if(battleRunning) return;
  if(equipped.length===0){
    toast("キャラを1体以上装備してください");
    return;
  }
  battleRunning=true;
  resetBattleHP();
  createEnemy();
  log("⚔️ バトル開始！");
  battleTimer=setInterval(playerAttack,1000);
  enemyTimer=setInterval(enemyAttack,1000);
}

function stopBattle(){
  battleRunning=false;
  clearInterval(battleTimer);
  clearInterval(enemyTimer);
  battleTimer=null;
  enemyTimer=null;
  log("⏸ バトル停止");
}

function playerAttack(){
  if(!battleRunning||!enemy) return;
  let damage=0;
  equipped.forEach(uid=>{
    const item=getOwned(uid);
    if(item && battleHP[uid]>0) damage+=statsOf(item).power;
  });
  if(damage<=0) return;
  enemy.currentHP-=damage;
  log("⚔️ 味方が合計"+damage+"ダメージ！");
  if(enemy.currentHP<=0){
    winEnemy();
    return;
  }
  renderEnemy();
}

function enemyAttack(){
  if(!battleRunning||!enemy) return;

  const active=equipped.map(uid=>getOwned(uid)).filter(item=>item && battleHP[item.uid]>0);
  if(!active.length){
    loseBattle();
    return;
  }

  active.forEach(target=>{
    battleHP[target.uid]-=enemy.power;
    log("👹 "+enemy.name+" → "+getCharacter(target.id).name+" に "+enemy.power+" ダメージ！");
  });

  renderBattleHP();

  const alive=active.filter(target=>battleHP[target.uid]>0);

  if(alive.length===0){
    loseBattle();
    return;
  }

  active.forEach(target=>{
    if(battleHP[target.uid]<=0){
      log("💥 "+getCharacter(target.id).name+" が倒された！");
    }
  });
}

function renderBattleHP(){
  renderTotals();
  renderInventory();
}

function loseBattle(){
  stopBattle();
  log("💀 3体全員が倒されました……");
  toast("💀 敗北！");
}

function winEnemy(){
  const defeated=getCharacter(enemy.id);
  log("🏆 "+defeated.name+" を撃破！");
  stopBattle();
  const roll=Math.random();
  if(roll<defeated.drop){
    const item={uid:crypto.randomUUID(),id:defeated.id,star:0};
    inventory.push(item);
    saveGame();
    showDrop(defeated);
  }else{
    toast("😢 ドロップしませんでした");
    setTimeout(()=>startBattle(),500);
  }
}

function showDrop(c){
  document.getElementById("dropImage").src=c.image;
  document.getElementById("dropName").textContent=c.name;
  document.getElementById("dropInfo").textContent="⭐ "+c.rarity+" を獲得！";
  document.getElementById("dropOverlay").classList.add("show");
  render();
}

function closeDrop(){
  document.getElementById("dropOverlay").classList.remove("show");
  startBattle();
}

function log(text){
  const box=document.getElementById("battleLog");
  box.innerHTML+="<div>"+new Date().toLocaleTimeString()+"　"+text+"</div>";
  box.scrollTop=box.scrollHeight;
}

function toast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.style.display="block";
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.style.display="none",1800);
}

loadGame();
render();
</script>
</body>
</html>
